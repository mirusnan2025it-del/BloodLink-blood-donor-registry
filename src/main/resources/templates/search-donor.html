<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BloodLink - Search Donor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
        }

        .header {
            background: #c62828;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .search-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #c62828;
            margin-bottom: 25px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 15px;
            align-items: end;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #c62828;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #a91f1f;
        }

        .results {
            margin-top: 30px;
        }

        .donor-card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .donor-card h3 {
            margin-top: 0;
            color: #c62828;
        }

        .donor-card p {
            margin: 7px 0;
        }

        .available {
            color: green;
            font-weight: bold;
        }

        .not-available {
            color: #d32f2f;
            font-weight: bold;
        }

        .date-info {
            color: #555;
        }

        .eligible-date {
            color: #c62828;
            font-weight: bold;
        }

        .message {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #c62828;
            text-decoration: none;
        }

        @media (max-width: 700px) {

            .form-row {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: 8px;
            }

            .container {
                margin: 20px auto;
            }
        }
    </style>
</head>

<body>

<div class="header">
    <h1>BloodLink</h1>
    <span>Donor Search</span>
</div>

<div class="container">

    <div class="search-card">

        <h2>Find a Blood Donor</h2>

        <div class="form-row">

            <div>
                <label>Blood Group</label>

                <select id="bloodType">
                    <option value="">Select Blood Group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>

            <div>
                <label>City</label>

                <input
                        type="text"
                        id="city"
                        placeholder="Enter city">
            </div>

            <button onclick="searchDonors()">
                Search
            </button>

        </div>

    </div>

    <div id="results" class="results"></div>

    <a href="/dashboard" class="back">
        ← Back to Dashboard
    </a>

</div>

<script>

    async function searchDonors() {

        const bloodType =
            document.getElementById("bloodType").value;

        const city =
            document.getElementById("city").value.trim();

        const results =
            document.getElementById("results");

        if (bloodType === "") {

            alert("Please select a blood group.");

            return;
        }

        results.innerHTML =
            "<div class='message'>Searching...</div>";

        try {

            let url;

            if (city !== "") {

                url =
                    "/api/donors/search/city?bloodType="
                    + encodeURIComponent(bloodType)
                    + "&city="
                    + encodeURIComponent(city);

            } else {

                url =
                    "/api/donors/search?bloodType="
                    + encodeURIComponent(bloodType);
            }

            const response = await fetch(url);

            if (!response.ok) {

                throw new Error("Search failed");

            }

            const donors = await response.json();

            if (donors.length === 0) {

                results.innerHTML =
                    "<div class='message'>" +
                    "No matching donors found." +
                    "</div>";

                return;
            }

            results.innerHTML = "";

            for (const donor of donors) {

                const card =
                    document.createElement("div");

                card.className = "donor-card";

                /*
                 * Check actual 90-day eligibility
                 */

                let isEligible = donor.available;

                let lastDonationText =
                    "No donation recorded";

                let nextEligibleText =
                    "Eligible to donate";

                if (donor.lastDonationDate) {

                    lastDonationText =
                        donor.lastDonationDate;

                    const lastDonation =
                        new Date(
                            donor.lastDonationDate
                        );

                    const nextEligible =
                        new Date(lastDonation);

                    nextEligible.setDate(
                        nextEligible.getDate() + 90
                    );

                    const today =
                        new Date();

                    /*
                     * Remove time part
                     */
                    today.setHours(0, 0, 0, 0);

                    nextEligible.setHours(0, 0, 0, 0);

                    if (today >= nextEligible) {

                        isEligible = true;

                        nextEligibleText =
                            "Eligible to donate";

                    } else {

                        isEligible = false;

                        nextEligibleText =
                            "Next eligible date: "
                            + formatDate(nextEligible);
                    }
                }

                const availabilityClass =
                    isEligible
                        ? "available"
                        : "not-available";

                const availabilityText =
                    isEligible
                        ? "Available to Donate"
                        : "Not Available - 90 Day Waiting Period";

                card.innerHTML = `

                    <h3>${donor.fullName}</h3>

                    <p>
                        <strong>Blood Group:</strong>
                        ${donor.bloodType}
                    </p>

                    <p>
                        <strong>City:</strong>
                        ${donor.city}
                    </p>

                    <p>
                        <strong>Phone:</strong>
                        ${donor.phone}
                    </p>

                    <p class="${availabilityClass}">
                        ${availabilityText}
                    </p>

                    <p class="date-info">
                        <strong>Last Donation:</strong>
                        ${lastDonationText}
                    </p>

                    <p class="eligible-date">
                        📅 ${nextEligibleText}
                    </p>

                `;

                results.appendChild(card);
            }

        } catch (error) {

            console.error(error);

            results.innerHTML =
                "<div class='message'>" +
                "Unable to search donors. " +
                "Please try again." +
                "</div>";
        }
    }


    /*
     * Convert date into DD-MM-YYYY format
     */

    function formatDate(date) {

        const day =
            String(date.getDate()).padStart(2, "0");

        const month =
            String(date.getMonth() + 1).padStart(2, "0");

        const year =
            date.getFullYear();

        return day + "-" + month + "-" + year;
    }

</script>

</body>
</html>
